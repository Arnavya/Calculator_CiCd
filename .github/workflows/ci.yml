name: CI - Quality, Security & Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: calculator-app

jobs:
  quality-tests:
    name: Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff app tests

      - name: Lint (flake8)
        run: flake8 app tests

      - name: Unit tests
        env:
          ENV: test
        run: |
          pytest -v --cov=app --cov-report=term-missing

  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  sca:
    name: SCA (Dependencies Audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install OWASP Dependency-Check CLI
        run: |
          curl -sSL https://github.com/jeremylong/DependencyCheck/releases/download/v8.0.2/dependency-check-8.0.2-release.zip -o dc.zip
          unzip dc.zip -d dc
          chmod +x dc/dependency-check/bin/dependency-check.sh

      - name: Run Dependency-Check
        run: |
          ./dc/dependency-check/bin/dependency-check.sh \
            --project "calculator-app" \
            --scan . \
            --format "HTML" \
            --out "reports"

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports

  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code (full history required)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (conditionally)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE || '' }}
        continue-on-error: true

  build-and-push:
    name: Build, Test & Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - quality-tests
      - sast
      - sca
      - secrets-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          SHA_TAG=sha-${GITHUB_SHA::7}
          docker build -t $IMAGE:latest -t $IMAGE:$SHA_TAG .

      - name: Image scan (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          exit-code: 1
          severity: CRITICAL

      - name: Container Smoke Test
        run: |
          docker run -d -p 8001:5000 --name calc-test \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          sleep 5
          curl -f http://localhost:8001/

      - name: Push Docker image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          SHA_TAG=sha-${GITHUB_SHA::7}
          docker push $IMAGE:latest
          docker push $IMAGE:$SHA_TAG

      - name: Cleanup
        if: always()
        run: docker rm -f calc-test || true
