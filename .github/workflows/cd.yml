name: CD - Deploy to EKS

on:
  workflow_run:
    workflows: ["CI - Build, Test & Security"]
    types:
      - completed

env:
  IMAGE_NAME: calculator-app
  K8S_MANIFESTS_PATH: k8s

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Build, Deploy & DAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------
      # Docker Build & Push
      # ----------------------------
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          SHA_TAG=sha-${GITHUB_SHA::7}

          docker build -t $IMAGE:latest -t $IMAGE:$SHA_TAG .
          docker push $IMAGE:latest
          docker push $IMAGE:$SHA_TAG

      # ----------------------------
      # Kubernetes Setup (EKS)
      # ----------------------------
      - name: Install kubectl
        run: |
          curl -LO https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      # ----------------------------
      # Deploy to EKS
      # ----------------------------
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f ${{ env.K8S_MANIFESTS_PATH }}
          kubectl set image deployment/calculator-deploy \
            calculator-deploy=${{ secrets.DOCKERHUB_USERNAME }}/calculator-app:latest
          kubectl rollout status deployment/calculator-deploy

      # ----------------------------
      # Dummy DAST (Assignment-level)
      # ----------------------------
      - name: Dummy DAST - Basic HTTP Check
        run: |
          SERVICE_IP=$(kubectl get svc calculator-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "Target: http://$SERVICE_IP"
          curl -I http://$SERVICE_IP
