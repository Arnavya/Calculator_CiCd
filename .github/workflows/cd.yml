name: CD - Deploy to Kubernetes

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: calculator-app
  K8S_MANIFESTS_PATH: k8s

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push Docker image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          SHA_TAG=sha-${GITHUB_SHA::7}
          docker build -t $IMAGE:latest -t $IMAGE:$SHA_TAG .
          docker push $IMAGE:latest
          docker push $IMAGE:$SHA_TAG

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.35.0

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f ${{ env.K8S_MANIFESTS_PATH }}
          kubectl set image deployment/calculator-deploy \
            calculator-deploy=${{ secrets.DOCKERHUB_USERNAME }}/calculator-app:latest
          kubectl rollout status deployment/calculator-deploy

      - name: Verify Service
        run: kubectl get svc calculator-service
