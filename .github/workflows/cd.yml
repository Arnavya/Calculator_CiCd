name: CD - Deploy to EKS

on:
  workflow_run:
    workflows: ["CI - Quality, Security & Build"]
    types:
      - completed

env:
  IMAGE_NAME: calculator-app
  K8S_MANIFESTS_PATH: k8s
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  deploy:
    name: Deploy to Amazon EKS
    runs-on: ubuntu-latest

    # Deploy only if CI succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Verify AWS identity
      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      # Install kubectl
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      # Configure kubeconfig
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      # Deploy to EKS using VERSIONED image
      - name: Deploy to EKS
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          TAG=sha-${GITHUB_SHA::7}

          echo "Deploying image: $IMAGE:$TAG"

          kubectl apply -f ${{ env.K8S_MANIFESTS_PATH }}

          kubectl set image deployment/calculator-deploy \
            calculator=$IMAGE:$TAG

          kubectl rollout status deployment/calculator-deploy

      # Verify service
      - name: Verify Deployment
        run: |
          kubectl get pods
          kubectl get svc calculator-service
