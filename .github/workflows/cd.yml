name: CD - Deploy to Kubernetes

# Trigger only after CI workflow completes successfully
on:
  workflow_run:
    workflows: ["CI - Quality, Security & Build"]  # <-- Your CI workflow name exactly
    types:
      - completed

env:
  IMAGE_NAME: calculator-app
  K8S_MANIFESTS_PATH: k8s

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    # Only run if CI succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Docker login
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4️⃣ Build & push Docker image
      - name: Build & push Docker image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          SHA_TAG=sha-${GITHUB_SHA::7}
          docker build -t $IMAGE:latest -t $IMAGE:$SHA_TAG .
          docker push $IMAGE:latest
          docker push $IMAGE:$SHA_TAG

      # 5️⃣ Set up kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.35.0

      # 6️⃣ Configure kubeconfig
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      # 7️⃣ Apply Kubernetes manifests
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f ${{ env.K8S_MANIFESTS_PATH }}
          kubectl set image deployment/calculator-deploy \
            calculator-deploy=${{ secrets.DOCKERHUB_USERNAME }}/calculator-app:latest
          kubectl rollout status deployment/calculator-deploy

      # 8️⃣ Verify Service
      - name: Verify Service
        run: kubectl get svc calculator-service
