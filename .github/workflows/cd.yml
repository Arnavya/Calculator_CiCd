name: CD - Deploy to EKS

on:
  workflow_run:
    workflows: ["CI - Quality, Security & Build"]
    types:
      - completed

env:
  IMAGE_NAME: calculator-app
  K8S_MANIFESTS_PATH: k8s
  AWS_REGION: eu-north-1

jobs:
  deploy:
    name: Deploy to Amazon EKS
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # AWS Auth
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # kubectl install
      - name: Install kubectl
        run: |
          curl -LO https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      # kubeconfig
      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      # Deploy
      - name: Deploy to EKS
        run: |
          kubectl apply -f ${{ env.K8S_MANIFESTS_PATH }}
          kubectl set image deployment/calculator-deploy \
            calculator-deploy=${{ secrets.DOCKERHUB_USERNAME }}/calculator-app:latest
          kubectl rollout status deployment/calculator-deploy

      # Dummy DAST (simple)
      - name: Dummy DAST Check
        run: |
          echo "Running basic DAST check"
          kubectl get svc calculator-service
